name: bootstrap test

on:
  push:
    branches:
      - cachyos
    paths:
      - bootstrap.sh
      - .bin/pacman/install

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - uses: actions/checkout@v6

      - name: ビルドユーザーの作成
        run: |
          pacman -Sy --noconfirm sudo
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: bootstrap.sh の実行
        run: |
          cp -r . /home/builder/dotfiles
          chown -R builder:builder /home/builder/dotfiles
          su builder -c "cd /home/builder/dotfiles && bash bootstrap.sh"
